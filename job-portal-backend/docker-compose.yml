version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=super-secret-jwt-access-key-for-job-portal
      - JWT_REFRESH_SECRET=super-secret-jwt-refresh-key-for-job-portal
      - CORS_ORIGIN=http://localhost:5173
      - STORAGE_DRIVER=local
      - EMAIL_DRIVER=console
      - SEARCH_ENABLED=false
      - PAYMENT_PROVIDER=mock
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
